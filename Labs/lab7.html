<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Unsplash API</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 30px;
    }

    input {
        padding: 10px;
        width: 250px;
    }

    button {
        padding: 10px;
        margin: 5px;
        cursor: pointer;
    }

    #results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 25px;
    }

    #results img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }
</style>

</head>

<body>

    <h1>Unsplash API</h1>

    <input type="text" id="searchInput" placeholder="Search photos">

    <button id="xhrBtn">Search using XHR</button>

    <button id="promiseBtn">Search using fetch (promises)</button>

    <button id="asyncBtn">Search using fetch (async/await)</button>

    <div id="results"></div>

    <script>
    const searchInput = document.getElementById("searchInput");
    const results = document.getElementById("results");


    const ACCESS_KEY = prompt("Enter your Unsplash Access Key: ");

    function getSearchUrl() {
        const query = searchInput.value.trim();

        if (!query) {
            results.textContent = "Please enter a search term.";
            return null;
        }

        if (!ACCESS_KEY) {
            results.textContent = "Please configure your Unsplash Access Key.";
            return null;
        }

        return "https://api.unsplash.com/search/photos?query=" +
            encodeURIComponent(query) + "&per_page=12";
    }

    function showPhotos(data) {
        results.innerHTML = "";

        if (!data.results || data.results.length === 0) {
            results.textContent = "No photos found.";
            return;
        }

        data.results.forEach(photo => {
            const img = document.createElement("img");
            img.src = photo.urls.small;
            img.alt = photo.alt_description || "Unsplash photo";
            img.loading = "lazy";
            results.appendChild(img);
        });
    }

    function showError(error) {
        results.textContent = "Error: " + error.message;
    }

    // Method 1: XMLHttpRequest
    document.getElementById("xhrBtn").addEventListener("click", () => {
        const url = getSearchUrl();
        if (!url) return;

        results.textContent = "Loading...";

        const xhr = new XMLHttpRequest();
        xhr.open("GET", url);
        xhr.setRequestHeader("Authorization", "Client-ID " + ACCESS_KEY);

        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    showPhotos(JSON.parse(xhr.responseText));
                } catch (error) {
                    showError(error);
                }
            } else {
                showError(new Error("HTTP " + xhr.status));
            }
        };

        xhr.onerror = () => showError(new Error("Network error"));
        xhr.send();
    });


    document.getElementById("promiseBtn").addEventListener("click", () => {
        const url = getSearchUrl();
        if (!url) return;

        results.textContent = "Loading...";

        fetch(url, {
            headers: { Authorization: "Client-ID " + ACCESS_KEY }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }
            return response.json();
        })
        .then(showPhotos)
        .catch(showError);
    });

  
    document.getElementById("asyncBtn").addEventListener("click", async () => {
        const url = getSearchUrl();
        if (!url) return;

        results.textContent = "Loading...";

        try {
            const response = await fetch(url, {
                headers: { Authorization: "Client-ID " + ACCESS_KEY }
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const data = await response.json();
            showPhotos(data);
        } catch (error) {
            showError(error);
        }
    });
</script>

</body>

</html>
